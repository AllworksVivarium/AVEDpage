<!doctype html>
<html lang="zh-CN" data-time-display="absolute" data-admin-theme="black">
<head>
  <link rel="stylesheet" href="/popup-density.css?v=1">
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101411"><title>万业携生收容公司 管理终端</title>
  <script src="/admin-theme.js?v=admin-practical-6"></script>
  <link rel="stylesheet" href="/interaction-motion.css?v=motion-3">
  <link rel="stylesheet" href="/site-refinements.css?v=brand-layout-2">
  <link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/admin-layout.css?v=notice-excerpts-3">
<link rel="stylesheet" href="/community.css">
<link rel="stylesheet" href="/economy.css?v=signal-5">
<link rel="stylesheet" href="/welfare.css?v=signal-5">
<link rel="stylesheet" href="/signal-preview.css?v=signal-5">
<link rel="stylesheet" href="/admin-themes.css?v=crt-publication-8">
  <link rel="stylesheet" data-inner-fonts="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap">
</head>
<body>
  <main id="app" class="shell">
    <section class="welcome" id="welcome">
      <div class="welcome-top"><span class="signal"><i></i> INTERNAL NETWORK</span></div>
      <div class="hero"><div class="rule"></div><div class="mark" aria-label="公司标志"><span></span><b>W</b></div><div class="rule"></div></div>
      <p class="eyebrow">万业携生收容公司 Allworks Vivarium Engineering Derec</p><h1>管理终端</h1>

      <button class="primary enter" id="enter">进入管理通道 <span>→</span></button>
      <div class="welcome-foot"><span>ACCESS REQUIRES AUTHORIZATION</span></div>
    </section>
    <section class="login-card hidden" id="loginCard">
      <div class="login-top"><button class="back" id="back">← 返回入口</button><span class="signal checking"><i></i> INTERNAL NETWORK</span></div><div class="mini-mark">W</div>
      <p class="eyebrow">ADMINISTRATOR LOGIN</p><h2>管理员登录</h2>
      <form id="loginForm" method="post" action="/api/login" autocomplete="on"><label>用户名 / 员工姓名<input name="loginIdentifier" autocomplete="username" required placeholder="请输入用户名或员工姓名"></label>
        <label>登录密码<input name="password" type="password" autocomplete="current-password" required placeholder="请输入密码"></label>
        <label><span><input name="remember" type="checkbox" checked>记住账号和密码</span></label><p class="error" id="error" role="alert"></p><button class="primary" type="submit">验证身份 <span>→</span></button></form>

    </section>
    <section class="dashboard hidden" id="dashboard">
      <header class="app-header"><div class="app-header-left"><button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="收起侧边栏" title="收起侧边栏"><span aria-hidden="true">◀</span></button><div class="brand"><div class="brand-mark">W</div><div><b>万业携生收容公司</b><small>管理终端 / ADMIN</small></div></div></div><div class="admin-header-actions"><button type="button" class="admin-theme-toggle" id="adminThemeToggle" aria-label="切换显示模式">☾ 黑色模式</button><button class="logout" id="logout">退出登录</button></div></header>
      <div class="portal-layout">
        <aside class="sidebar" id="sidebar">
          <div class="side-heading"><span class="eyebrow">导航 / NAVIGATION</span></div>
          <nav class="tabs" aria-label="管理导航">
            <button class="tab active" data-tab="admin">员工管理</button>
            <button class="tab" data-tab="robots">公司机器人设置</button>
            <button class="tab" data-tab="content">公告</button>
            <button class="tab" data-tab="dossiers">收容卷宗</button>
            <button class="tab" data-tab="broadcast">广播</button>
            <button class="tab" data-tab="moderation">图文审核</button>
            <button class="tab" data-tab="activity">活动记录</button><button class="tab" data-tab="speech">通讯追溯</button><button class="tab" data-tab="terminology">用语规范</button><button class="tab" data-tab="achievements">成就档案</button>
          </nav>
          <section class="music-box"><p class="eyebrow">音乐盒 / MUSIC</p><div id="musicTitle" class="music-title">还没有音乐</div>
            <audio id="musicAudio" preload="none"></audio><div class="music-controls"><button id="musicPrev" aria-label="上一首">|◀</button><button id="musicPlay" aria-label="播放或暂停">▶</button><button id="musicNext" aria-label="下一首">▶|</button></div>
            <label class="music-volume">音量 <input id="musicVolume" type="range" min="0" max="1" step="0.05" value="0.35"></label>
          </section>
          <div class="sidebar-foot">监察记录 内部留存</div>
        </aside>
        <main class="portal-main">
          <div id="panel" aria-live="polite"></div>
          <footer class="app-footer"><span>万业携生收容公司 内部资料</span><span>ACCESS LOGGED</span></footer>
        </main>
      </div>
    </section>
  </main>
  <script src="/http-client.js?v=signal-5" defer></script>
  <script src="/admin-time.js?v=admin-only-1" defer></script>
  <script src="/admin-terminology.js?v=admin-only-1" defer></script>
  <script src="/interaction-motion.js?v=motion-1" defer></script>
  <script src="/admin-company-robots.js?v=compact-2" defer></script>
  <script src="/app.js?v=personnel-kinds-10" defer></script>
  <script src="/admin-extra.js?v=results-music-2" defer></script>
<script src="/admin-community.js?v=lazy-notices-3" defer></script>
<link rel="stylesheet" href="/currency-symbol.css?v=coin-1">
<script src="/currency-symbol.js?v=coin-1" defer></script>

<script src="/admin-achievements.js?v=hub-1" defer></script>
<script src="/admin-interactions.js?v=compact-popup-2" defer></script>
</body>
</html>
